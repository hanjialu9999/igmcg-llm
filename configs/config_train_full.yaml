# 全量训练配置：attn_linear + 12 项高价值特性 + Step 级 checkpoint
# 数据：merged.txt（3.65M 行全量），1 epoch
# 预计时间：~16.7 小时（DML, AMD 780M iGPU, 4250 tok/s）
# Step checkpoint：25%/50%/80% 时存档（~4.2h/8.4h/13.4h），中断可用 --resume 续训
model:
  vocab_size: 12000
  embedding_dim: 256
  num_heads: 8
  num_layers: 4
  hidden_dim: 512
  max_seq_length: 64
  dropout: 0
  tie_weights: true
  gradient_checkpointing: false
  rope_base: 10000.0
  rope_max_len: 4096
  mask_fill_value: -1e9
  layer_plan: "attn,attn,attn,attn"
  ssm_d_state: 16
  ssm_d_inner_factor: 1
  ssm_dt_rank: null
  ssm_conv_kernel: 3
  ssm_dt_proj_bias_init: 0.1
  ssm_a_log_init_range: [-1, 1]
  ssm_D_init: 1.0
  attn_window: 0
  attn_rel_bias: false
  alibi: true
  mixer: "attn_linear"
  char_merge: true
  char_merge_kernel: 3
  char_merge_dropout: 0.0
  rope_dim_fraction: 0.5
  output_gate: true
  zero_centered_norm: true
  fuse_swiglu: true
  yarn_scale: 2.0
  yarn_beta: 0.1
  yarn_orig_max_seq_length: 0
  intra_hybrid_rope: true
  intra_hybrid_ratio: 0.5
  head_temp: true
  value_relative_coding: true
  gpas: true
  gpas_alpha_init: 0.5
  alibi_learnable: true

training:
  batch_size: 24
  epochs: 1                      # 全量 1 epoch（3.65M 行 × 1ep ≈ 16.7h）
  learning_rate: 3.0e-3
  optimizer: sgd
  sgd_learning_rate: 0.1
  momentum: 0.9
  weight_decay: 0.0
  gradient_clip: 1.0
  warmup_steps: 100              # 全量训练需更多预热（0.1% 步数）
  early_stop_patience: 9999
  label_smoothing: 0.0
  cpu_threads: 4
  checkpoint_percents: [0.25, 0.5, 0.8]  # 25%/50%/80% 存档（~4.2h/8.4h/13.4h）
  precision: "fp32"
  grad_accum_steps: 1
  eta_min: 0.0
  lr_schedule: "wsd"
  wsd_decay_frac: 0.1
  compile: false

data:
  train_file: "data/pretrain_corpus/merged.txt"  # 全量 3.65M 行
  vocab_size: 12000
  max_seq_length: 64
  num_workers: 0
  test_split: 0.1

paths:
  checkpoint_dir: "checkpoints_train_full"
  log_dir: "logs_train_full"

device: "auto"
seed: 42
